<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شاشة الكاشير والأوردرات | ALQALYUBE Orders</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <script src="https://tailwindcss.com"></script>
  <script src="https://jsdelivr.net"></script>
  <style>body { font-family: 'Cairo', sans-serif; background-color: #09090b; color: #f4f4f5; }</style>
</head>
<body>

  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-yellow-500/40 rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl">
      <div class="w-14 h-14 rounded-full bg-yellow-400 text-black font-black text-2xl flex items-center justify-center mx-auto mb-3">🛎️</div>
      <h1 class="text-xl font-black text-yellow-400">شاشة الكاشير واستقبال الطلبات</h1>
      <p class="text-xs text-zinc-400 mt-1 mb-5">أدخل كلمة مرور الكاشير للمتابعة</p>
      <input id="ordersPassInput" type="password" onkeydown="if(event.key==='Enter') checkLogin()" placeholder="كلمة المرور" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-center text-white outline-none focus:border-yellow-400 mb-3">
      <button onclick="checkLogin()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-black py-3 rounded-xl transition">دخول الكاشير</button>
    </div>
  </div>

  <div id="ordersDashboard" class="hidden max-w-6xl mx-auto p-4 pb-20">
    <header class="bg-zinc-900 border border-yellow-500/40 rounded-2xl p-4 mb-6 flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-xl md:text-2xl font-black text-yellow-400">🛎️ شاشة استقبال الطلبات المباشرة (الكاشير)</h1>
        <p class="text-xs text-zinc-400">تحديث تلقائي لحظي مع تنبيه صوتي عند وصول طلب جديد</p>
      </div>

      <div class="flex bg-zinc-800 p-1 rounded-xl">
        <button onclick="setBranch('all')" id="btn-all" class="px-4 py-2 rounded-lg text-xs font-black bg-yellow-400 text-black">كل الفروع</button>
        <button onclick="setBranch('qanater')" id="btn-qanater" class="px-4 py-2 rounded-lg text-xs font-bold text-zinc-300">فرع القناطر</button>
        <button onclick="setBranch('basous')" id="btn-basous" class="px-4 py-2 rounded-lg text-xs font-bold text-zinc-300">فرع باسوس</button>
      </div>
    </header>

    <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </div>
  <script>
    const SUPABASE_URL = 'https://supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8VODvIWiUFVkkdQjqZc7cA_NtPhuTI7';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allOrders = [];
    let currentBranch = 'all';

    async function checkLogin() {
      const entered = document.getElementById('ordersPassInput').value.trim();
      const { data } = await db.from('settings').select('value').eq('key', 'orders_password').single();
      if (data && data.value === entered) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('ordersDashboard').classList.remove('hidden');
        startCashierSystem();
      } else {
        alert('كلمة مرور الكاشير غير صحيحة!');
      }
    }

    function playAlertSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.35);
    }

    function setBranch(b) {
      currentBranch = b;
      ['all', 'qanater', 'basous'].forEach(id => {
        document.getElementById('btn-' + id).className = id === b
          ? 'px-4 py-2 rounded-lg text-xs font-black bg-yellow-400 text-black'
          : 'px-4 py-2 rounded-lg text-xs font-bold text-zinc-300';
      });
      renderOrders();
    }

    async function fetchOrders() {
      const { data } = await db.from('orders').select('*').order('id', { ascending: false }).limit(60);
      allOrders = data || [];
      renderOrders();
    }

    function renderOrders() {
      const filtered = currentBranch === 'all' ? allOrders : allOrders.filter(o => o.branch === currentBranch);
      const grid = document.getElementById('ordersGrid');

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-16 text-zinc-500">لا توجد طلبات مسجلة حالياً في هذا القسم.</div>';
        return;
      }

      grid.innerHTML = filtered.map(o => {
        const isPending = o.status === 'pending';
        const isPreparing = o.status === 'preparing';
        const badge = isPending
          ? '<span class="bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 px-2.5 py-0.5 rounded-full text-xs font-black animate-pulse">⏳ قيد المراجعة</span>'
          : isPreparing
          ? '<span class="bg-green-500/20 text-green-400 border border-green-500/40 px-2.5 py-0.5 rounded-full text-xs font-black">🔥 قيد التنفيذ</span>'
          : o.status === 'delivered'
          ? '<span class="bg-blue-500/20 text-blue-400 px-2.5 py-0.5 rounded-full text-xs font-bold">✅ تم التوصيل</span>'
          : '<span class="bg-red-500/20 text-red-400 px-2.5 py-0.5 rounded-full text-xs font-bold">❌ ملغي</span>';

        return '<div class="bg-zinc-900 border-2 ' + (isPending ? 'border-yellow-400' : 'border-zinc-800') + ' rounded-2xl p-4 flex flex-col justify-between shadow-xl">' +
          '<div>' +
            '<div class="flex justify-between items-center mb-2">' +
              '<span class="font-black text-base text-white">#' + o.id + ' • ' + (o.branch === 'qanater' ? 'فرع القناطر' : 'فرع باسوس') + '</span>' +
              badge +
            '</div>' +
            '<div class="bg-zinc-800/80 rounded-xl p-3 mb-3 text-xs space-y-1">' +
              '<div>👤 <b>العميل:</b> ' + o.customer_name + '</div>' +
              '<div>📞 <b>الهاتف:</b> <a href="tel:' + o.customer_phone + '" class="text-yellow-400 font-bold underline">' + o.customer_phone + '</a></div>' +
              '<div>📍 <b>العنوان:</b> ' + o.customer_address + '</div>' +
            '</div>' +
            '<div class="space-y-1.5 mb-3 border-t border-zinc-800 pt-2">' +
              o.items.map(i =>
                '<div class="text-xs flex justify-between">' +
                  '<span><b>' + i.qty + '×</b> ' + i.name + ' (' + i.size + ')' + (i.addons.length ? ' <span class="text-zinc-400">[+' + i.addons.join('، ') + ']</span>' : '') + '</span>' +
                  '<span class="text-yellow-400 font-bold">' + (i.price * i.qty) + ' ج.م</span>' +
                '</div>'
              ).join('') +
            '</div>' +
          '</div>' +
          '<div>' +
            '<div class="flex justify-between items-center border-t border-zinc-800 pt-2 mb-3">' +
              '<span class="text-xs text-zinc-400">الإجمالي المطلوب</span>' +
              '<span class="text-lg font-black text-yellow-400">' + o.total_price + ' ج.م</span>' +
            '</div>' +
            '<div class="grid grid-cols-2 gap-2 text-xs">' +
              (isPending ? '<button onclick="updateStatus(' + o.id + ', \'preparing\')" class="col-span-2 bg-green-600 hover:bg-green-500 text-white font-black py-2.5 rounded-xl">✅ تأكيد وتحويل لقيد التنفيذ</button>' : '') +
              (isPreparing ? '<button onclick="updateStatus(' + o.id + ', \'delivered\')" class="col-span-2 bg-blue-600 hover:bg-blue-500 text-white font-black py-2.5 rounded-xl">🛵 تم التوصيل للعميل</button>' : '') +
              ((isPending || isPreparing) ? '<button onclick="updateStatus(' + o.id + ', \'cancelled\')" class="col-span-2 bg-zinc-800 hover:bg-red-600/80 text-zinc-300 hover:text-white font-bold py-1.5 rounded-xl">إلغاء الطلب</button>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    async function updateStatus(id, status) {
      await db.from('orders').update({ status }).eq('id', id);
      fetchOrders();
    }

    function startCashierSystem() {
      fetchOrders();
      db.channel('cashier-orders')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, () => {
          playAlertSound();
          fetchOrders();
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, () => fetchOrders())
        .subscribe();
    }
  </script>
</body>
</html>
